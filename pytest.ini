[pytest]
# Where pytest looks for tests
testpaths = tests

# Add the project root to Python's import path.
# This makes 'from config import settings' and 'from domain...' work in tests
# without installing the project as a package.
pythonpath = .

# Test discovery patterns (these are pytest defaults, listed here for clarity)
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show extra information when a test fails
addopts = -v
