# Alembic Configuration File
# ===========================
# Alembic manages database schema migrations — tracking and applying changes
# to the database structure as the application evolves.
#
# Why Alembic?
# - When you add a new column or table, you need a safe way to update the
#   database without destroying existing data.
# - Alembic generates migration scripts automatically by comparing your
#   SQLAlchemy models to the current database schema.
# - Migrations can be applied forward (upgrade) or reversed (downgrade).
#
# Common commands (run from the project root):
#   alembic revision --autogenerate -m "add users table"  → generate migration
#   alembic upgrade head                                   → apply all migrations
#   alembic downgrade -1                                   → undo last migration
#   alembic history                                        → show migration history

[alembic]
# Path to the directory containing migration scripts and env.py
script_location = alembic

# The database URL is read from alembic/env.py (which imports our settings)
# rather than being hardcoded here. This avoids duplicating configuration
# and ensures tests and production use the same URL source.
# sqlalchemy.url is intentionally left unset here — see alembic/env.py.

# Timezone for migration file timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
